services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: razer_raders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_USER: razer_raders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razer_raders -d razer_raders"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - radar-postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://razer_raders:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/razer_raders
    restart: "no"

  web:
    build: .
    command: ["node", ".next/standalone/server.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://razer_raders:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/razer_raders
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"

  worker:
    build: .
    command: ["pnpm", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://razer_raders:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/razer_raders
      RADAR_COLLECTION_INTERVAL_MS: 7200000
      RADAR_CONFIGURATION_VERSION: ${RADAR_CONFIGURATION_VERSION:-profile@v1}
      RADAR_COMPATIBLE_RUNTIME_API_KEY: ${RADAR_COMPATIBLE_RUNTIME_API_KEY:-}
      RADAR_COMPATIBLE_RUNTIME_BASE_URL: ${RADAR_COMPATIBLE_RUNTIME_BASE_URL:-}
      RADAR_COMPATIBLE_RUNTIME_MODEL: ${RADAR_COMPATIBLE_RUNTIME_MODEL:-}
      RADAR_PIPELINE_VERSION: ${RADAR_PIPELINE_VERSION:-assessment-pipeline@v1}

volumes:
  radar-postgres-data:
